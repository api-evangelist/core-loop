name: Core Loop
description: 'Core Loop is a game studio founded in 2020 by Vincenzo Alagna and Dan
  Chao, veterans of Machine Zone, GREE, and Funzio, building a modern cross-platform
  MMO at the intersection of massively multiplayer online games and web3. The studio
  is developing an AI-directed, dynamic world that evolves based on the actions of
  the community, with a blockchain-based, player-driven virtual economy in which participants
  truly own the assets they craft or earn and can potentially make a living in the
  game long-term. The game targets both PC and mobile. Core Loop raised a Series A
  led by Andreessen Horowitz, with participation from Galaxy Digital, Block.one, 1Up
  Ventures, Dune Ventures, and others, and operates as a remote-first team headquartered
  in Oakland, California. As a game studio, Core Loop does not currently publish a
  public developer API, SDK, MCP server, or developer portal, so this profile is
  identity-only.'
